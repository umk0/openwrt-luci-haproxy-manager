name: Build and release packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Source and package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check sources
        run: python scripts/check.py
      - name: Build portable IPK packages
        run: python scripts/build-ipk.py
      - name: Check package contents
        run: python scripts/check.py --dist

  releases:
    name: Resolve supported OpenWrt releases
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      legacy_version: ${{ steps.versions.outputs.legacy_version }}
      modern_version: ${{ steps.versions.outputs.modern_version }}
    steps:
      - uses: actions/checkout@v5
      - id: versions
        name: Resolve latest patch releases
        run: python scripts/openwrt-releases.py --github-output "$GITHUB_OUTPUT"

  sdk:
    name: OpenWrt ${{ matrix.version }} / ${{ matrix.processor }}
    needs: [quality, releases]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.releases.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Download and verify OpenWrt SDK
        env:
          BASE_URL: https://downloads.openwrt.org/releases/${{ matrix.version }}/targets/${{ matrix.target }}
        run: |
          set -eux
          sdk_file="$(curl -fsSL "$BASE_URL/" | grep -oE 'openwrt-sdk-[^"<]+Linux-x86_64\.tar\.zst' | head -n1)"
          test -n "$sdk_file"
          curl -fsSL -o "/tmp/$sdk_file" "$BASE_URL/$sdk_file"
          curl -fsSL -o /tmp/sha256sums "$BASE_URL/sha256sums"
          grep -F " *$sdk_file" /tmp/sha256sums > /tmp/sdk.sha256
          (cd /tmp && sha256sum --check sdk.sha256)
          mkdir -p /tmp/openwrt-sdk
          tar --zstd -xf "/tmp/$sdk_file" -C /tmp/openwrt-sdk
      - name: Build packages
        run: |
          sdk_dir="$(find /tmp/openwrt-sdk -mindepth 1 -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)"
          test -n "$sdk_dir"
          sh scripts/build-openwrt-sdk.sh "$sdk_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.series }}-${{ matrix.target_id }}
          path: |
            dist/*.ipk
            dist/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [releases, sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download OpenWrt 24.10 packages
        uses: actions/download-artifact@v5
        with:
          name: packages-24.10-x86-64
          path: release/ipk
      - name: Download OpenWrt 25.12 packages
        uses: actions/download-artifact@v5
        with:
          name: packages-25.12-x86-64
          path: release/apk
      - name: Prepare release assets
        env:
          LEGACY_VERSION: ${{ needs.releases.outputs.legacy_version }}
          MODERN_VERSION: ${{ needs.releases.outputs.modern_version }}
        run: |
          set -eux
          mkdir -p release/assets
          cp release/ipk/*.ipk release/assets/
          cp release/apk/*.apk release/assets/
          (cd release/ipk && zip -9 -j ../assets/haproxy-manager-openwrt-24.10-ipk.zip ./*.ipk)
          (cd release/apk && zip -9 -j ../assets/haproxy-manager-openwrt-25.12-apk.zip ./*.apk)
          cat > release/assets/INSTALL.md <<EOF
          # Installation

          Packages were validated with OpenWrt ${LEGACY_VERSION} and ${MODERN_VERSION} SDKs.
          They are architecture-independent and work on every OpenWrt target.

          ## OpenWrt 24.10 (opkg)

          Upload the base IPK and one optional language IPK to /tmp, then run:

              opkg install /tmp/luci-app-haproxy-manager_*.ipk
              opkg install /tmp/luci-i18n-haproxy-manager-ru_*.ipk

          ## OpenWrt 25.12 (apk)

          Upload the base APK and one optional language APK to /tmp, then run:

              apk add --no-network --allow-untrusted /tmp/luci-app-haproxy-manager-*.apk
              apk add --no-network --allow-untrusted /tmp/luci-i18n-haproxy-manager-ru-*.apk

          Available language suffixes: ru, es, ko, ja, zh-cn. English is built in.
          EOF
          (cd release/assets && sha256sum ./*.ipk ./*.apk ./*.zip > SHA256SUMS)
          cat > release/notes.md <<EOF
          ## Packages

          - OpenWrt 24.10: use the IPK files or \`haproxy-manager-openwrt-24.10-ipk.zip\`.
          - OpenWrt 25.12: use the APK files or \`haproxy-manager-openwrt-25.12-apk.zip\`.
          - English is included in the base package. Other languages are separate packages.
          - Packages are architecture-independent; CI validated x86_64, ARM64, and MIPS SDKs.

          See \`INSTALL.md\` for commands and \`SHA256SUMS\` for checksums.
          EOF
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "HAProxy Manager $GITHUB_REF_NAME" \
              --notes-file release/notes.md
          else
            gh release create "$GITHUB_REF_NAME" release/assets/* \
              --title "HAProxy Manager $GITHUB_REF_NAME" \
              --notes-file release/notes.md \
              --verify-tag
          fi
